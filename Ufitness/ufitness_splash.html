<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UFitness Splash Screen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #05050a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
  }

  .phone {
    width: 390px;
    height: 844px;
    background: #0c0906;
    border-radius: 48px;
    padding: 14px;
    box-shadow: 0 0 0 2px #2a241c, 0 40px 80px rgba(0,0,0,0.6);
  }

  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 36px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 420px 420px at 50% 36%, #4a2408 0%, #1c1006 42%, #0a0704 78%, #060405 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }

  .ring {
    position: absolute;
    top: 35%;
    left: 50%;
    width: 40px;
    height: 40px;
    border: 1.5px solid #F07C1D;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    animation: pulseRing 2.6s ease-out infinite;
  }
  .ring:nth-child(2) { animation-delay: 0.65s; }
  .ring:nth-child(3) { animation-delay: 1.3s; }

  @keyframes pulseRing {
    0%   { width: 30px; height: 30px; opacity: 0.7; border-color: #FFD166; }
    70%  { opacity: 0.1; }
    100% { width: 380px; height: 380px; opacity: 0; border-color: #B03D0A; }
  }

  .logowrap {
    position: relative;
    width: 220px;
    height: 220px;
    margin-top: -30px;
    transform: scale(0.4);
    opacity: 0;
    animation: pop 0.9s cubic-bezier(.2,.9,.25,1.3) 0.25s forwards;
  }

  .logowrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 0 30px rgba(240,124,29,0.35));
    mix-blend-mode: screen;
  }

  @keyframes pop {
    0%   { transform: scale(0.4) rotate(-8deg); opacity: 0; }
    60%  { transform: scale(1.08) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .wordmark {
    position: relative;
    margin-top: 6px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 36px;
    letter-spacing: 1px;
    display: flex;
    opacity: 0;
    animation: rise 0.7s ease-out 1.05s forwards;
  }
  .wordmark .u { color: #FFF3D6; }
  .wordmark .fitness { color: #F07C1D; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .tagline {
    margin-top: 10px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #a3907c;
    opacity: 0;
    animation: rise 0.7s ease-out 1.35s forwards;
  }

  .dots {
    position: absolute;
    bottom: 70px;
    display: flex;
    gap: 8px;
    opacity: 0;
    animation: rise 0.5s ease-out 1.7s forwards;
  }
  .dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #F07C1D;
    animation: bounce 1s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="logowrap">
      <img src="./assets/splash-logo.png" alt="UFitness">
    </div>
    <div class="wordmark">
      <span class="u">U</span><span class="fitness">FITNESS</span>
    </div>
    <div class="tagline">MOVE. CAMPUS. TOGETHER.</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</div>
</body>
</html>
